<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Administrador</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        #cerrar-sesion {
            background: #d9534f;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .resumen {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tarjeta {
            background: white;
            padding: 20px;
            border-radius: 12px;
            flex: 1;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .tarjeta h3 {
            margin-top: 0;
        }

        .pedido {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .pedido h3 {
            margin-top: 0;
        }

        .producto-pedido {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        .estado {
            display: inline-block;
            background: #ffc107;
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .sin-pedidos {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
        }

        @media (max-width: 700px) {

            .resumen {
                flex-direction: column;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }

        }

    </style>
</head>

<body>

    <header>

        <h1>✏️ Panel de Administrador</h1>

        <button id="cerrar-sesion">
            Cerrar sesión
        </button>

    </header>


    <main>

        <div class="resumen">

            <div class="tarjeta">

                <h3>📦 Pedidos</h3>

                <strong id="cantidad-pedidos">
                    0
                </strong>

            </div>


            <div class="tarjeta">

                <h3>💰 Ventas</h3>

                <strong id="total-ventas">
                    $0.00 MXN
                </strong>

            </div>

        </div>


        <h2>📋 Pedidos recibidos</h2>

        <div id="lista-pedidos">

            <div class="sin-pedidos">
                Cargando pedidos...
            </div>

        </div>

    </main>


    <script type="module">

        import { auth, db } from "../js/firebase.js";

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        import {
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        // Comprobar si el administrador inició sesión

        onAuthStateChanged(auth, (usuario) => {

            if (!usuario) {

                window.location.href = "login.html";

            } else {

                cargarPedidos();

            }

        });


        // Cerrar sesión

        document
            .getElementById("cerrar-sesion")
            .addEventListener("click", async () => {

                await signOut(auth);

                window.location.href = "login.html";

            });


        // Cargar pedidos

        async function cargarPedidos() {

            const lista =
                document.getElementById("lista-pedidos");

            try {

                const consulta =
                    await getDocs(collection(db, "pedidos"));


                lista.innerHTML = "";


                let cantidadPedidos = 0;

                let totalVentas = 0;


                consulta.forEach((documento) => {

                    const pedido = documento.data();

                    cantidadPedidos++;

                    totalVentas += Number(pedido.total) || 0;


                    const tarjeta =
                        document.createElement("div");

                    tarjeta.className = "pedido";


                    let productosHTML = "";


                    if (Array.isArray(pedido.productos)) {

                        pedido.productos.forEach((producto) => {

                            productosHTML += `

                                <div class="producto-pedido">

                                    ✏️ ${producto.producto}

                                    <br>

                                    Cantidad:
                                    ${producto.cantidad}

                                    <br>

                                    Precio:
                                    $${producto.precio}.00 MXN

                                    <br>

                                    Subtotal:
                                    $${producto.subtotal}.00 MXN

                                </div>

                            `;

                        });

                    }


                    let fechaTexto = "Fecha no disponible";


                    if (pedido.fecha) {

                        fechaTexto =
                            pedido.fecha.toDate()
                            .toLocaleString("es-MX");

                    }


                    tarjeta.innerHTML = `

                        <h3>
                            📦 Pedido
                        </h3>

                        <p>
                            <strong>Cliente:</strong>
                            ${pedido.cliente || "Sin nombre"}
                        </p>

                        <p>
                            <strong>Teléfono:</strong>
                            ${pedido.telefono || "Sin teléfono"}
                        </p>

                        <p>
                            <strong>Dirección:</strong>
                            ${pedido.direccion || "Sin dirección"}
                        </p>

                        <p>
                            <strong>Fecha:</strong>
                            ${fechaTexto}
                        </p>

                        <h4>
                            Productos:
                        </h4>

                        ${productosHTML}

                        <p>
                            <strong>
                                Total:
                                $${pedido.total || 0}.00 MXN
                            </strong>
                        </p>

                        <span class="estado">
                            ${pedido.estado || "Pendiente"}
                        </span>

                    `;


                    lista.appendChild(tarjeta);

                });


                document.getElementById(
                    "cantidad-pedidos"
                ).textContent = cantidadPedidos;


                document.getElementById(
                    "total-ventas"
                ).textContent =
                    "$" + totalVentas.toFixed(2) + " MXN";


                if (cantidadPedidos === 0) {

                    lista.innerHTML = `

                        <div class="sin-pedidos">

                            No hay pedidos registrados.

                        </div>

                    `;

                }

            } catch (error) {

                console.error(
                    "Error al cargar pedidos:",
                    error
                );

                lista.innerHTML = `

                    <div class="sin-pedidos">

                        ❌ No se pudieron cargar los pedidos.

                    </div>

                `;

            }

        }

    </script>

</body>

</html>
